<header class="bg-red-950/95 border-b border-red-900/40 shadow-lg">

  <div><p class="text-xs text-red-200/70">Busta Postale</p><h1 class="text-2xl font-bold">Allenamenti</h1><p class="text-sm text-red-100/70 mt-1">Programma giornaliero suddiviso per data e gruppo</p></div>
  <div class="flex gap-2 flex-wrap"><a href="index.html" class="bg-stone-800 hover:bg-stone-700 border border-stone-700 rounded-xl px-3 py-2 text-sm"><i class="fa-solid fa-arrow-left mr-1"></i> Cronometro</a><a href="risultati.html" class="bg-stone-800 hover:bg-stone-700 border border-stone-700 rounded-xl px-3 py-2 text-sm">Risultati test</a></div>

  <label for="date-select" class="block text-sm font-semibold mb-2">Seleziona la data dell'allenamento</label>
  <div class="flex flex-col sm:flex-row gap-3">
   <select id="date-select" class="w-full sm:max-w-sm bg-stone-950 border border-stone-700 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-rose-600"></select>
   <div id="workout-summary" class="text-sm text-stone-400 self-center"></div>
  </div>
 </section>
 <div id="workout-content" class="space-y-5"></div>
 <p class="text-xs text-stone-500 px-1">Per aggiungere altri allenamenti, inviami il testo con il giorno e la data: verrà inserito come nuova scheda selezionabile.</p>
</main>

function makeTable(rows){
 const wrap=document.createElement("div");wrap.className="table-wrap";
 const table=document.createElement("table");const thead=document.createElement("thead");const hr=document.createElement("tr");
 ["Esercizio / voce","Indicazioni"].forEach(t=>{const th=document.createElement("th");th.textContent=t;hr.appendChild(th)});thead.appendChild(hr);table.appendChild(thead);
 const tbody=document.createElement("tbody");
 rows.forEach(r=>{const tr=document.createElement("tr");r.forEach((v,i)=>{const td=document.createElement("td");td.textContent=v;if(i===0)td.className="font-semibold text-stone-200";else td.className="text-stone-300";tr.appendChild(td)});tbody.appendChild(tr)});
 table.appendChild(tbody);wrap.appendChild(table);return wrap;
}
function renderWorkout(){
 const workout=workouts.find(w=>w.date===document.getElementById("date-select").value)||workouts[0];
 const content=document.getElementById("workout-content");content.replaceChildren();
 document.getElementById("workout-summary").textContent=workout.sections.length+" sezioni · riscaldamento, corsa, potenza e resistenza";
 const title=document.createElement("h2");title.className="text-xl font-bold";title.textContent="Allenamento – "+workout.label;
 const top=document.createElement("div");top.className="bg-stone-900 border border-red-950 rounded-2xl p-4 sm:p-5";top.appendChild(title);content.appendChild(top);
 workout.sections.forEach((s,i)=>{
  const card=document.createElement("section");card.className="workout-card bg-stone-900 border border-stone-800 rounded-2xl p-4 sm:p-5 space-y-3";
  const h=document.createElement("h3");h.className="text-base sm:text-lg font-bold text-rose-200";h.textContent=(i+1)+". "+s.title;card.appendChild(h);
  if(s.intro){const p=document.createElement("p");p.className="text-sm text-stone-400";p.textContent=s.intro;card.appendChild(p)}
  if(s.rows)card.appendChild(makeTable(s.rows));
  if(s.groups)s.groups.forEach(g=>{const gh=document.createElement("h4");gh.className="font-semibold text-sm text-sky-200 mt-3";gh.textContent=g.name;card.appendChild(gh);card.appendChild(makeTable(g.rows))});
  content.appendChild(card);
 });
}
const select=document.getElementById("date-select");
workouts.forEach(w=>{const opt=document.createElement("option");opt.value=w.date;opt.textContent=w.label;select.appendChild(opt)});
select.value=workouts[0].date;select.addEventListener("change",renderWorkout);renderWorkout();

</html>
