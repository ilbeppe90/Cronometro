<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Risultati test corsa - Busta Postale</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
table{width:100%;border-collapse:collapse}
th,td{padding:.75rem .8rem;text-align:left;border-bottom:1px solid rgba(120,113,108,.2);white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:#a8a29e;background:#1c1917}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover,tbody tr:focus{background:rgba(127,29,29,.25);outline:none}
.table-wrap{overflow-x:auto;border:1px solid rgba(120,113,108,.2);border-radius:.8rem}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.detail-item{min-width:0;border:1px solid rgba(120,113,108,.22);background:rgba(12,10,9,.6);border-radius:.65rem;padding:.65rem}
.detail-label{font-size:.68rem;color:#a8a29e;margin-bottom:.2rem}
.detail-value{font-size:.9rem;color:#f5f5f4;overflow-wrap:anywhere}
@media(min-width:700px){.detail-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){th,td{padding:.65rem .55rem;font-size:.78rem}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen">
<header class="bg-red-950/95 border-b border-red-900/40 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
    <div><p class="text-xs text-red-200/70">Busta Postale</p><h1 class="text-xl sm:text-2xl font-bold">Risultati test di corsa</h1></div>
    <div class="flex gap-2 flex-wrap"><a href="index.html" class="shrink-0 bg-rose-700 hover:bg-rose-600 border border-rose-600 rounded-xl px-3 py-2 text-sm font-semibold text-white"><i class="fa-solid fa-house mr-1"></i> Home</a><a href="allenamenti.html" class="shrink-0 bg-rose-900 hover:bg-rose-800 border border-rose-700/50 rounded-xl px-3 py-2 text-sm"><i class="fa-solid fa-calendar-days mr-1"></i> Allenamenti</a><a href="cronometro.html" class="shrink-0 bg-stone-800 hover:bg-stone-700 border border-stone-700 rounded-xl px-3 py-2 text-sm"><i class="fa-solid fa-stopwatch mr-1"></i> Cronometro</a></div>
  </div>
</header>
<main class="max-w-7xl mx-auto p-3 sm:p-6">
  <section class="bg-stone-900 border border-red-950 rounded-2xl p-4 sm:p-5 shadow-xl">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-4">
      <div><h2 class="font-semibold">Archivio risultati</h2><p id="status" class="text-xs text-stone-400 mt-1">Caricamento del CSV…</p></div>
      <div class="flex flex-col sm:flex-row gap-2">
        <input id="search" type="search" placeholder="Cerca atleta, data o nota…" class="bg-stone-950 border border-stone-700 rounded-xl px-3 py-2 text-sm min-w-0 sm:w-64 focus:outline-none focus:border-rose-600">
        <button id="refresh" class="bg-rose-900 hover:bg-rose-800 border border-rose-700/50 rounded-xl px-4 py-2 text-sm font-semibold"><i class="fa-solid fa-rotate mr-1"></i> Aggiorna</button>
      </div>
    </div>
    <div id="results-body" class="space-y-5"></div>
    <p class="mt-3 text-[11px] text-stone-500">Seleziona una riga o il nome di un'atleta per aprire la scheda completa con tutti i risultati dei test.</p>
  </section>
</main>
<div id="detail-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-3 sm:p-6" role="dialog" aria-modal="true" aria-labelledby="detail-title">
  <section class="w-full max-w-4xl max-h-[92vh] overflow-y-auto rounded-2xl border border-stone-700 bg-stone-900 shadow-2xl">
    <div class="sticky top-0 z-10 flex items-start justify-between gap-3 border-b border-stone-700 bg-stone-900 p-4 sm:p-5">
      <div><p class="text-xs uppercase tracking-wider text-stone-400">Scheda atleta</p><h2 id="detail-title" class="text-xl sm:text-2xl font-bold mt-1"></h2><p id="detail-status" class="text-sm mt-1"></p></div>
      <button id="close-modal" class="shrink-0 rounded-xl border border-stone-700 bg-stone-800 px-3 py-2 hover:bg-stone-700" aria-label="Chiudi scheda"><i class="fa-solid fa-xmark mr-1"></i> Chiudi</button>
    </div>
    <div id="detail-content" class="p-4 sm:p-5 space-y-5"></div>
  </section>
</div>
<script>
const csvUrl = "https://raw.githubusercontent.com/ilbeppe90/Cronometro/main/dati/risultati.csv";
let allRows = [];
const labels=["Atleta","Stato test","Data Test 1","1 km","3 km (1)","3 km (2)","3 km (3)","Totale 3 km","Ritmo 3 km","Note Test 1","Data Test 2","Squat","Affondi alternati","Plank","Salita 1 km","RPE","Note Test 2"];
const groups=[
  {name:"OK",label:"Test completato",style:"text-emerald-300",badge:"bg-emerald-950/70 border-emerald-800"},
  {name:"SOLO 1",label:"Solo Test 1",style:"text-sky-300",badge:"bg-sky-950/70 border-sky-800"},
  {name:"DA FARE",label:"Da fare",style:"text-amber-300",badge:"bg-amber-950/70 border-amber-800"}
];
function parseCSV(text){
  const rows=[];let row=[],field="",quoted=false;
  text=text.charCodeAt(0)===0xFEFF?text.slice(1):text;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"'&&quoted&&next==='"'){field+='"';i++;}
    else if(ch==='"')quoted=!quoted;
    else if(ch===';'&&!quoted){row.push(field);field="";}
    else if((ch.charCodeAt(0)===10||ch.charCodeAt(0)===13)&&!quoted){
      if(ch.charCodeAt(0)===13&&next&&next.charCodeAt(0)===10)i++;
      row.push(field);field="";
      if(row.some(v=>v.trim()!==""))rows.push(row);
      row=[];
    }else field+=ch;
  }
  if(field.length||row.length){row.push(field);if(row.some(v=>v.trim()!==""))rows.push(row);}
  return rows;
}
function statusOf(r){const s=(r[1]||"").trim().toLocaleUpperCase("it");return s==="1"||s==="SOLO 1"?"SOLO 1":s==="OK"?"OK":"DA FARE";}
function render(){
  const q=document.getElementById("search").value.trim().toLocaleLowerCase("it");
  const body=document.getElementById("results-body");body.replaceChildren();
  const shown=allRows.filter(r=>r.some(v=>String(v||"").toLocaleLowerCase("it").includes(q)));
  groups.forEach(group=>{
    const rows=shown.filter(r=>statusOf(r)===group.name);
    if(!rows.length)return;
    const section=document.createElement("section");
    const heading=document.createElement("h3");heading.className="font-bold text-lg mb-3 "+group.style;heading.textContent=group.label+" ("+rows.length+")";section.appendChild(heading);
    const wrap=document.createElement("div");wrap.className="table-wrap";
    const table=document.createElement("table");
    const thead=document.createElement("thead"),hr=document.createElement("tr");
    ["Atleta","Data Test 1","1 km","Totale 3 km","Data Test 2","Stato"].forEach(t=>{const th=document.createElement("th");th.textContent=t;hr.appendChild(th);});
    thead.appendChild(hr);table.appendChild(thead);
    const tbody=document.createElement("tbody");
    rows.forEach(r=>{
      const tr=document.createElement("tr");tr.tabIndex=0;tr.setAttribute("role","button");tr.setAttribute("aria-label","Apri scheda "+(r[0]||"atleta"));
      const vals=[r[0],r[2],r[3],r[7],r[10],statusOf(r)];
      vals.forEach((v,i)=>{
        const td=document.createElement("td");td.textContent=(v||"").trim()||"—";
        if(i===0){td.className="font-bold text-rose-200";td.style.minWidth="150px";}
        if(i===5){const badge=document.createElement("span");badge.className="inline-block rounded-full border px-2 py-1 text-xs "+group.badge+" "+group.style;badge.textContent=statusOf(r);td.replaceChildren(badge);}
        tr.appendChild(td);
      });
      tr.addEventListener("click",()=>openDetail(r));
      tr.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openDetail(r);}});
      tbody.appendChild(tr);
    });
    table.append(tbody);wrap.appendChild(table);section.appendChild(wrap);body.appendChild(section);
  });
  if(!shown.length){const empty=document.createElement("p");empty.className="p-6 text-center text-stone-500";empty.textContent="Nessun risultato corrispondente.";body.appendChild(empty);}
  document.getElementById("status").textContent=shown.length+" di "+allRows.length+" atlete visualizzate · OK: "+shown.filter(r=>statusOf(r)==="OK").length+" · Solo 1: "+shown.filter(r=>statusOf(r)==="SOLO 1").length+" · Da fare: "+shown.filter(r=>statusOf(r)==="DA FARE").length;
}
function openDetail(r){
  const modal=document.getElementById("detail-modal"),content=document.getElementById("detail-content");
  document.getElementById("detail-title").textContent=(r[0]||"Atleta").trim();
  const status=statusOf(r),g=groups.find(x=>x.name===status)||groups[2];
  const statusEl=document.getElementById("detail-status");statusEl.className="text-sm mt-1 "+g.style;statusEl.textContent=g.label;
  content.replaceChildren();
  const makeSection=(title,from,to)=>{
    const section=document.createElement("section");section.className="space-y-3";
    const h=document.createElement("h3");h.className="font-semibold text-base border-b border-stone-700 pb-2";h.textContent=title;section.appendChild(h);
    const grid=document.createElement("div");grid.className="detail-grid";
    for(let i=from;i<to;i++){
      if(i===0||i===1)continue;
      const item=document.createElement("div");item.className="detail-item";
      const lab=document.createElement("div");lab.className="detail-label";lab.textContent=labels[i];
      const val=document.createElement("div");val.className="detail-value";val.textContent=String(r[i]||"").trim()||"—";
      item.append(lab,val);grid.appendChild(item);
    }
    section.appendChild(grid);content.appendChild(section);
  };
  makeSection("Test 1 · corsa",2,10);
  makeSection("Test 2 · forza e salita",10,17);
  modal.classList.remove("hidden");modal.classList.add("flex");document.body.style.overflow="hidden";
  document.getElementById("close-modal").focus();
}
function closeDetail(){const modal=document.getElementById("detail-modal");modal.classList.add("hidden");modal.classList.remove("flex");document.body.style.overflow="";}
async function loadResults(){
  const status=document.getElementById("status");status.textContent="Caricamento del CSV…";
  try{
    const response=await fetch(csvUrl+"?ts="+Date.now(),{cache:"no-store"});if(!response.ok)throw new Error("HTTP "+response.status);
    const rows=parseCSV(await response.text());if(rows.length<2)throw new Error("Il file non contiene risultati.");
    const headers=rows[0].map(h=>h.trim().toLocaleLowerCase("it"));
    const indexes=["atleta","test 1 e 2","data test 1","1 km (tempo)","3 km (tempo) (1)","3 km (tempo) (2)","3 km (tempo) (3)","3 km (tempo)","ritmo 3 km","note","data test 2","squat","affondi alternati","plank","salita 1 km","rpe","note"].map((h,i)=>i===16?headers.lastIndexOf(h):headers.indexOf(h));
    if(indexes[0]<0)throw new Error("Colonna Atleta non trovata.");
    allRows=rows.slice(1).filter(r=>(r[indexes[0]]||"").trim()).map(r=>indexes.map(i=>i>=0?(r[i]||"").trim():""));
    render();
  }catch(e){status.textContent="Errore nel caricamento del CSV: "+e.message;const body=document.getElementById("results-body");body.replaceChildren();const p=document.createElement("p");p.className="p-6 text-center text-rose-300";p.textContent="Impossibile caricare il CSV. Verifica che il file sia presente nella repository.";body.appendChild(p);}
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("refresh").addEventListener("click",loadResults);
document.getElementById("close-modal").addEventListener("click",closeDetail);
document.getElementById("detail-modal").addEventListener("click",e=>{if(e.target.id==="detail-modal")closeDetail();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail();});
loadResults();
</script>
</body>
</html>
